# Tuned for an 8 GB Mac: one 2 GB daemon, Kotlin compiles inside it instead of a second JVM.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
kotlin.compiler.execution.strategy=in-process
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
