# Release APKs, built and signed on GitHub instead of the owner's Mac. Pushing a v* tag builds that
# commit against the lumen-ai commit pinned in .github/lumen-ai.commit (so a tag always rebuilds
# the same APKs), signs them with the release key (repository secrets), checks the signature, and
# attaches the APKs and checksums to a draft release; notes are added and the draft published by
# hand.
#
# Two jobs: the build runs Gradle and every plugin and dependency, so it gets read-only access
# and no stored git credentials; only the release job, which runs no build code, may write.
# Actions are pinned to commits, not movable tags.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (must exist)
        required: true
env:
  TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: lumen-ai at its pinned commit, next to the app (settings.gradle.kts builds it from source)
        run: |
          commit=$(tr -d '[:space:]' < .github/lumen-ai.commit)
          git init -q ../lumen-ai
          git -C ../lumen-ai fetch -q --depth 1 https://github.com/subhashhhhhh/lumen-ai.git "$commit"
          git -C ../lumen-ai checkout -q FETCH_HEAD
          echo "LUMEN_AI_COMMIT=$commit" >> "$GITHUB_ENV"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      # The runner has the Android SDK; this adds the versions the build asks for.
      - name: SDK, NDK and CMake versions the build asks for
        run: |
          sdkmanager=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-37.0" "ndk;30.0.16248370" "cmake;4.1.2" > /dev/null
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Release key
        env:
          KEYSTORE: ${{ secrets.LUMEN_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/lumen-release.jks"
          echo "LUMEN_KEYSTORE=$RUNNER_TEMP/lumen-release.jks" >> "$GITHUB_ENV"
      - name: Build
        env:
          LUMEN_KEY_PASSWORD: ${{ secrets.LUMEN_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Name, check signature, checksums
        run: |
          rm -f "$LUMEN_KEYSTORE"
          version="${TAG#v}"
          mkdir out
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            cp "app/build/outputs/apk/release/app-$abi-release.apk" "out/Lumen-$version-$abi.apk"
          done
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)/apksigner
          for f in out/*.apk; do
            "$apksigner" verify --print-certs "$f" | grep -q "SHA-256 digest: 442f3c6c65e3c125a149bb8572605fdf96617fb25d4aea01f5185bbbbd38abbc" \
              || { echo "::error::$f is not signed with Lumen's release key"; exit 1; }
          done
          (cd out && sha256sum Lumen-*.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "Built from $(git rev-parse --short HEAD) with lumen-ai ${LUMEN_AI_COMMIT::7}" > out/BUILD.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release
          path: out/
          retention-days: 3
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release
          path: out
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --draft --title "Lumen ${TAG#v}" --notes "$(cat out/BUILD.txt). Notes to come."
          gh release upload "$TAG" out/Lumen-*.apk out/SHA256SUMS.txt --clobber
