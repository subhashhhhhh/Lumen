buffers { size_kb: 65536 fill_policy: RING_BUFFER }
data_sources { config { name: "linux.process_stats" process_stats_config { scan_all_processes_on_start: true } } }
data_sources { config { name: "linux.ftrace" ftrace_config {
  ftrace_events: "sched/sched_switch" ftrace_events: "task/task_newtask" ftrace_events: "task/task_rename"
  atrace_categories: "gfx" atrace_categories: "view" atrace_categories: "input" atrace_categories: "dalvik" atrace_categories: "am" atrace_categories: "res"
  atrace_apps: "com.subhashh.lumen.debug"
} } }
duration_ms: 5000
