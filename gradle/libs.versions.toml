[versions]
lumenAi = "0.1.0"
testRunner = "1.7.0"
orgJson = "20260814"
avifCoder = "3.0.0"
junit = "4.13.2"
agp = "9.4.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
coreKtx = "1.19.1"
exifinterface = "1.4.2"
coil = "3.6.3"
backdrop = "2.0.1"
telephoto = "0.19.0"
media3 = "1.11.1"
baselineprofile = "1.5.0"
benchmark = "1.5.0"
uiautomator = "2.4.0"
testExtJunit = "1.3.0"
profileinstaller = "1.4.1"
print = "1.1.0"
# 1.29+ bundles Microsoft telemetry (1DS: device id, locale, events sent on app start via a
# ContentProvider). Lumen promises nothing leaves the phone: stay on 1.28 unless a newer
# release is checked to be telemetry-free (unzip the AAR: no ai/onnxruntime/telemetry classes).
onnxruntime = "1.28.0"
litertlm = "0.18.1"
litert = "2.3.0"
work = "2.12.0"
# Maps (Details → Location): MapLibre Native, open source, no telemetry, no Google services.
# The OpenGL build: the default one requires Vulkan, which would hide Lumen from some phones in Play.
maplibre = "13.7.1"

[libraries]
lumen-ai = { module = "app.lumen-photos:lumen-ai", version.ref = "lumenAi" }
maplibre-android = { module = "org.maplibre.gl:android-sdk-opengl", version.ref = "maplibre" }
litert = { module = "com.google.ai.edge.litert:litert", version.ref = "litert" }
litert-gpu = { module = "com.google.ai.edge.litert:litert-gpu", version.ref = "litert" }
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }
onnxruntime-android = { module = "com.microsoft.onnxruntime:onnxruntime-android", version.ref = "onnxruntime" }
litertlm-android = { module = "com.google.ai.edge.litertlm:litertlm-android", version.ref = "litertlm" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "testRunner" }
org-json = { module = "org.json:json", version.ref = "orgJson" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-video = { module = "io.coil-kt.coil3:coil-video", version.ref = "coil" }
coil-svg = { module = "io.coil-kt.coil3:coil-svg", version.ref = "coil" }
coil-gif = { module = "io.coil-kt.coil3:coil-gif", version.ref = "coil" }
avif-coder-coil = { module = "io.github.awxkee:avif-coder-coil", version.ref = "avifCoder" }
backdrop = { module = "io.github.kyant0:backdrop", version.ref = "backdrop" }
telephoto-zoomable-image-coil3 = { module = "me.saket.telephoto:zoomable-image-coil3", version.ref = "telephoto" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui-compose = { module = "androidx.media3:media3-ui-compose", version.ref = "media3" }
androidx-print = { module = "androidx.print:print", version.ref = "print" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }
androidx-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "testExtJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-test = { id = "com.android.test", version.ref = "agp" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "baselineprofile" }
